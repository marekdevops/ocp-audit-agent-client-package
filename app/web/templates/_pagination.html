<nav class="table-pagination" aria-label="Table pagination">
  <span>Showing {{ pagination.start }}-{{ pagination.end }} of {{ pagination.total }}</span>
  <div>
    {% if pagination.previous_url %}
    <a href="{{ pagination.first_url }}" data-page-link>First</a>
    <a href="{{ pagination.previous_url }}" data-page-link>Previous</a>
    {% else %}
    <span class="disabled">First</span><span class="disabled">Previous</span>
    {% endif %}
    <strong>Page {{ pagination.page }} of {{ pagination.pages }}</strong>
    {% if pagination.next_url %}
    <a href="{{ pagination.next_url }}" data-page-link>Next</a>
    <a href="{{ pagination.last_url }}" data-page-link>Last</a>
    {% else %}
    <span class="disabled">Next</span><span class="disabled">Last</span>
    {% endif %}
  </div>
</nav>
