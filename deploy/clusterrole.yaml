apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ocp-audit-agent-readonly
rules:
- apiGroups: [""]
  resources: ["pods","replicationcontrollers","events","nodes","namespaces","services","endpoints","configmaps","persistentvolumes","persistentvolumeclaims","serviceaccounts","resourcequotas","limitranges"]
  verbs: ["get","list","watch"]
- apiGroups: ["apps"]
  resources: ["deployments","daemonsets","statefulsets","replicasets"]
  verbs: ["get","list","watch"]
- apiGroups: ["batch"]
  resources: ["jobs","cronjobs"]
  verbs: ["get","list","watch"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles","rolebindings","clusterroles","clusterrolebindings"]
  verbs: ["get","list","watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies","ingresses","ingressclasses"]
  verbs: ["get","list","watch"]
- apiGroups: ["policy"]
  resources: ["poddisruptionbudgets"]
  verbs: ["get","list","watch"]
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get","list","watch"]
- apiGroups: ["storage.k8s.io"]
  resources: ["storageclasses","csidrivers","csinodes","csistoragecapacities","volumeattachments"]
  verbs: ["get","list","watch"]
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["get","list","watch"]
- apiGroups: ["admissionregistration.k8s.io"]
  resources: ["validatingwebhookconfigurations","mutatingwebhookconfigurations","validatingadmissionpolicies","validatingadmissionpolicybindings"]
  verbs: ["get","list","watch"]
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get","list","watch"]
- apiGroups: ["apiregistration.k8s.io"]
  resources: ["apiservices"]
  verbs: ["get","list","watch"]
- apiGroups: ["scheduling.k8s.io"]
  resources: ["priorityclasses"]
  verbs: ["get","list","watch"]
- apiGroups: ["node.k8s.io"]
  resources: ["runtimeclasses"]
  verbs: ["get","list","watch"]
- apiGroups: ["certificates.k8s.io"]
  resources: ["certificatesigningrequests"]
  verbs: ["get","list","watch"]
- apiGroups: ["snapshot.storage.k8s.io"]
  resources: ["volumesnapshots","volumesnapshotcontents","volumesnapshotclasses"]
  verbs: ["get","list","watch"]
- apiGroups: ["autoscaling.k8s.io"]
  resources: ["verticalpodautoscalers"]
  verbs: ["get","list","watch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["nodes","pods"]
  verbs: ["get","list"]
- apiGroups: ["compliance.openshift.io"]
  resources: ["compliancecheckresults","compliancescans","compliancesuites"]
  verbs: ["get","list","watch"]
- apiGroups: ["wgpolicyk8s.io"]
  resources: ["policyreports","clusterpolicyreports"]
  verbs: ["get","list","watch"]
- apiGroups: ["aquasecurity.github.io"]
  resources: ["vulnerabilityreports"]
  verbs: ["get","list","watch"]
- apiGroups: ["k8s.cni.cncf.io"]
  resources: ["network-attachment-definitions"]
  verbs: ["get","list","watch"]
- apiGroups: ["config.openshift.io"]
  resources: ["clusterversions","clusteroperators","infrastructures","proxies","networks","dnses","authentications","images","apiservers","schedulers","oauths"]
  verbs: ["get","list","watch"]
- apiGroups: ["machineconfiguration.openshift.io"]
  resources: ["machineconfigpools"]
  verbs: ["get","list","watch"]
- apiGroups: ["route.openshift.io"]
  resources: ["routes"]
  verbs: ["get","list","watch"]
- apiGroups: ["operator.openshift.io"]
  resources: ["ingresscontrollers","kubeapiservers","kubecontrollermanagers","kubeschedulers","etcds"]
  verbs: ["get","list","watch"]
- apiGroups: ["security.openshift.io"]
  resources: ["securitycontextconstraints"]
  verbs: ["get","list","watch"]
- apiGroups: ["operators.coreos.com"]
  resources: ["clusterserviceversions","subscriptions","installplans","catalogsources","operatorgroups"]
  verbs: ["get","list","watch"]
- apiGroups: ["machine.openshift.io"]
  resources: ["machines","machinesets","machinehealthchecks"]
  verbs: ["get","list","watch"]
# Secrets are intentionally excluded. Kubernetes RBAC cannot expose Secret metadata
# without also allowing Secret data reads. Use clusterrole-with-secrets-metadata-risk.yaml
# only after accepting that risk and keep AUDIT_REDACT_SECRETS=true.
