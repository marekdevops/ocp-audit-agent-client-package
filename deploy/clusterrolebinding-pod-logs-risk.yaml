apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ocp-audit-agent-pod-logs-risk
  annotations:
    audit.openshift.io/risk: "Optional diagnostic access to pod logs."
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ocp-audit-agent-pod-logs-risk
subjects:
- kind: ServiceAccount
  name: ocp-audit-agent
  namespace: ocp-audit
