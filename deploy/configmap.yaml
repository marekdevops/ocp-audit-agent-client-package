apiVersion: v1
kind: ConfigMap
metadata:
  name: ocp-audit-agent-config
  namespace: ocp-audit
data:
  AUDIT_NAMESPACE: ocp-audit
  AUDIT_DATA_DIR: /data
  AUDIT_DB_PATH: /data/audit.db
  AUDIT_DATABASE_URL: postgresql://ocp_audit@ocp-audit-postgres:5432/ocp_audit
  AUDIT_REPORT_DIR: /data/reports
  AUDIT_LOG_LEVEL: INFO
  AUDIT_CLUSTER_NAME: auto
  AUDIT_RETENTION_DAYS: "14"
  AUDIT_SNAPSHOT_INTERVAL_SECONDS: "900"
  AUDIT_ENABLE_OPENSHIFT: "true"
  AUDIT_ENABLE_SECRET_AUDIT: "false"
  AUDIT_ENABLE_K8S_JOB_TRIGGER: "false"
  AUDIT_ANONYMIZE_OUTPUT: "false"
  AUDIT_ALLOW_UI_DEANONYMIZE: "true"
  AUDIT_WEB_HOST: 0.0.0.0
  AUDIT_WEB_PORT: "8080"
  AUDIT_WEB_EXPOSE_DOCS: "false"
  AUDIT_EVENT_BUFFER_SIZE: "500"
  AUDIT_REDACT_SECRETS: "true"
  AUDIT_COLLECT_POD_LOGS: "false"
  AUDIT_POD_LOG_TAIL_LINES: "80"
  AUDIT_POD_LOG_LIMIT_BYTES: "20000"
  AUDIT_POD_LOG_MIN_AGE_MINUTES: "10"
  AUDIT_POD_LOG_MIN_RESTARTS: "3"
  AUDIT_POD_LOG_PATTERN_MIN_COUNT: "3"
